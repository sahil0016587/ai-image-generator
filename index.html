<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI Video Studio</h1>
    
    <div class="input-group">
        <label for="prompt">Describe the video you want to generate:</label>
        <input type="text" id="prompt" placeholder="e.g., A cinematic robot walking in cyberpunk city" value="A futuristic astronaut floating in deep space, cinematic 8k">
    </div>

    <button id="generateBtn" onclick="generateVideo()">Generate Video 🚀</button>

    <div id="status"></div>
    <video id="outputVideo" controls></video>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL REPLICATE TOKEN (r8_...)
    const REPLICATE_API_TOKEN = "r8_"+"UlOol72VJzzT6dmkRAUI7AceRJ665DQ34yBLV";

    async function generateVideo() {
        const promptInput = document.getElementById('prompt').value;
        const statusDiv = document.getElementById('status');
        const generateBtn = document.getElementById('generateBtn');
        const videoElement = document.getElementById('outputVideo');

        if (!promptInput) {
            alert("Please enter a prompt!");
            return;
        }

        if (REPLICATE_API_TOKEN === "PASTE_YOUR_REPLICATE_TOKEN_HERE" || !REPLICATE_API_TOKEN) {
            alert("Please add your Replicate API Token in the code!");
            return;
        }

        generateBtn.disabled = true;
        statusDiv.innerText = "⏳ Initiating Cloud AI Server...";
        videoElement.style.display = "none";

        try {
            // Step 1: Start Video Generation
            const response = await fetch("https://api.replicate.com/v1/predictions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${REPLICATE_API_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    version: "0b1d620584b4d0ed154b81048b26f58f43eb91187d90479f61dd66c42a20b206",
                    input: { prompt: promptInput }
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error);
            }

            const getUrl = data.urls.get;
            statusDiv.innerText = "🎨 Rendering Video (This takes ~30 seconds)...";

            // Step 2: Poll for Result
            let completed = false;
            while (!completed) {
                await new Promise(r => setTimeout(r, 3000));
                
                const checkStatus = await fetch(getUrl, {
                    headers: {
                        "Authorization": `Bearer ${REPLICATE_API_TOKEN}`
                    }
                });
                const result = await checkStatus.json();

                if (result.status === "succeeded") {
                    completed = true;
                    statusDiv.innerText = "✅ Video Generated Successfully!";
                    videoElement.src = result.output;
                    videoElement.style.display = "block";
                } else if (result.status === "failed") {
                    throw new Error("Video generation failed on server.");
                } else {
                    statusDiv.innerText = `⏳ Status: ${result.status}... Please wait.`;
                }
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ Error: " + error.message;
        } finally {
            generateBtn.disabled = false;
        }
    }
</script>

</body>
</html>
