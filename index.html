<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { margin-top: 15px; color: #38bdf8; }
        video { width: 100%; margin-top: 15px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>AI Video Studio</h1>
    <input type="text" id="prompt" value="A futuristic astronaut floating in space">
    <button id="btn" onclick="run()">Generate Video</button>
    <div id="status"></div>
    <video id="vid" controls></video>
</div>

<script>
    const TOKEN = "r8_"+"UlOol72VJzzT6dmkRAUI7AceRJ665DQ34yBLV"; // Yahan apna token paste karein
    
    async function run() {
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.innerText = "Connecting...";

        try {
            // Humne yahan proxy ka use kiya hai jo 'Failed to Fetch' error ko fix karega
            const response = await fetch("https://corsproxy.io/?https://api.replicate.com/v1/models/anotherjesse/zeroscope-v2-xl/predictions", {
                method: "POST",
                headers: {
                    "Authorization": `Token ${TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ input: { prompt: document.getElementById('prompt').value } })
            });

            const data = await response.json();
            const pollUrl = data.urls.get;
            
            status.innerText = "Generating... please wait 30s";

            let interval = setInterval(async () => {
                const res = await fetch("https://corsproxy.io/?" + pollUrl, {
                    headers: { "Authorization": `Token ${TOKEN}` }
                });
                const result = await res.json();
                if (result.status === "succeeded") {
                    clearInterval(interval);
                    document.getElementById('vid').src = result.output;
                    document.getElementById('vid').style.display = "block";
                    status.innerText = "Success!";
                    btn.disabled = false;
                }
            }, 3000);
        } catch (e) {
            status.innerText = "Error: " + e.message;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
